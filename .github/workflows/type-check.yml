name: Type Checking and Coverage

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  type-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    
    steps:
    - uses: actions/checkout@v4

    - name: Install system deps (OpenBabel + SWIG + cmake + g++)
      run: |
        sudo apt-get update
        sudo apt-get install -y openbabel libopenbabel-dev swig cmake g++
    
    - name: Make OpenBabel visible under /usr/local (for PyPI openbabel build)
      run: |
        # Headers: apt puts them in /usr/include/openbabel3, but PyPI build guesses /usr/local/include/openbabel3
        sudo mkdir -p /usr/local/include/openbabel3
        if [ ! -e /usr/local/include/openbabel3/openbabel ]; then
          sudo ln -s /usr/include/openbabel3/openbabel /usr/local/include/openbabel3/openbabel
        fi

        # Libraries: apt usually puts them in /usr/lib/x86_64-linux-gnu, but PyPI build often guesses /usr/local/lib
        sudo mkdir -p /usr/local/lib
        for f in /usr/lib/x86_64-linux-gnu/libopenbabel* /usr/lib/libopenbabel* /usr/lib64/libopenbabel*; do
          if [ -e "$f" ]; then sudo ln -sf "$f" /usr/local/lib/; fi
        done

        sudo ldconfig
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    
    - name: Run mypy
      run: |
        mypy OCDocker --config-file mypy.ini
      continue-on-error: false
    
    - name: Resolve coverage threshold
      run: |
        python - <<'PY'
        import importlib.util
        import os
        from pathlib import Path

        conftest_path = Path("tests") / "conftest.py"
        spec = importlib.util.spec_from_file_location("ocdocker_tests_conftest", conftest_path)
        if spec is None or spec.loader is None:
            raise RuntimeError(f"Unable to load {conftest_path}")
        conftest = importlib.util.module_from_spec(spec)
        spec.loader.exec_module(conftest)

        missing = sorted(conftest._missing_external_tools())
        threshold = 88 if not missing else 85

        print("Missing external tools:", ", ".join(missing) if missing else "none")
        print("Coverage fail-under:", threshold)

        with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as envf:
            envf.write(f"COV_FAIL_UNDER={threshold}\n")
        PY

    - name: Run tests with coverage
      run: |
        pytest --cov=OCDocker --cov-report=term-missing --cov-report=xml --cov-fail-under=${COV_FAIL_UNDER} -v
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml
        flags: unittests
        token: ${{ secrets.CODECOV_TOKEN }}
        name: codecov-umbrella
        fail_ci_if_error: false
      continue-on-error: true
