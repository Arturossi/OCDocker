name: ocdocker
# Full lockfile used by install.sh and container images, exported from an environment that
# passed the full test suite. Conda supplies Python and the CUDA runtime; pip supplies the rest
# at exact versions. Python 3.11 matches pyproject.toml requires-python, mypy.ini, and CI.
# Pip extras in pyproject.toml define optional dependency groups; this env
# approximates a full scientific stack (similar to pip install "ocdocker[all,dev]").
# Source of truth for pip version bounds: pyproject.toml
# ODDT is intentionally excluded: scripts/vendor_oddt.sh supplies
# the required Arturossi/oddt fork before OCDocker is installed.
channels:
  - defaults
  - conda-forge
