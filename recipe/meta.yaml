{% set name = "ocdocker" %}
{% set version = "0.9.1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  path: ..

build:
  noarch: python
  script: 
    - "{{ PYTHON }} -m pip install . --no-deps -vv"
  script_env:
    - PIP_INDEX_URL=https://pypi.org/simple

requirements:
  host:
    - python =3.11
    - pip
    - setuptools ==80.8.0

  run:
    - python >=3.9,<3.12
    - rdkit ==2024.09.1
    - pandas ==2.2.3
    - scikit-learn ==1.5.2
    - seaborn ==0.13.2
    - matplotlib ==3.9.2
    - scipy ==1.14.1
    - openbabel ==3.1.1
    - numpy ==1.26.4
    - optuna ==3.6.1
    - optuna-dashboard ==0.16.2
    - optuna-integration ==4.0.0
    - pingouin ==0.5.5
    - pytorch ==2.4.1
    - torchaudio ==2.4.1
    - torchvision ==0.19.1
    - xgboost ==2.1.1
    - lime ==0.2.0.1
    - pyyaml ==6.0.2
    - joblib ==1.4.2
    - biopython ==1.84
    - dcor ==0.6
    - fsspec ==2024.10.0
    - numba ==0.60.0
    - python-graphviz ==0.20.3
    - pandas-flavor ==0.6.0
    - scikit-image ==0.24.0
    - statsmodels ==0.14.3
    - xarray ==2024.10.0
    - pillow ==10.4.0
    - sphinx ==8.2.3
    - setuptools-scm ==8.1.0

about:
  home: https://github.com/Arturossi/OCDocker
  summary: "Molecular docking automation, virtual screening, and AI consensus scoring"
  license: Apache-2.0

extra:
  recipe-maintainers:
    - arturossi
