name: ocdocker

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    command: --mysql-native-password=ON  # pragma: allowlist secret
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in your Docker environment}
      MYSQL_DATABASE: ${OCDOCKER_DATABASE:-ocdocker}
      MYSQL_USER: ${OCDOCKER_DB_USER:-ocdocker}
      MYSQL_PASSWORD: ${OCDOCKER_DB_PASS:?Set OCDOCKER_DB_PASS in your Docker environment}
      OCDOCKER_OPTIMIZEDB: ${OCDOCKER_OPTIMIZEDB:-optimization}
    ports:
      - "${OCDOCKER_DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sh:/docker-entrypoint-initdb.d/20-init-optimization-db.sh:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  ocdocker:
    build:
      context: ../..
      dockerfile: containers/docker/ocdocker.dockerfile
    image: ${OCDOCKER_IMAGE:-ocdocker:local}
    depends_on:
      db:
        condition: service_healthy
    environment:
      OCDOCKER_CONFIG: ${OCDOCKER_CONFIG:-/etc/ocdocker/OCDocker.cfg.mysql}
      OCDOCKER_DB_BACKEND: mysql
      OCDOCKER_DB_USER: ${OCDOCKER_DB_USER:-ocdocker}
      OCDOCKER_DB_PASS: ${OCDOCKER_DB_PASS:?Set OCDOCKER_DB_PASS in your Docker environment}
      OCDOCKER_DATABASE: ${OCDOCKER_DATABASE:-ocdocker}
      OCDOCKER_OPTIMIZEDB: ${OCDOCKER_OPTIMIZEDB:-optimization}
      OCDOCKER_LOCK_WORKSPACE: ${OCDOCKER_LOCK_WORKSPACE:-true}
      OCDOCKER_THREADS: ${OCDOCKER_THREADS:-}
      SNAKEMAKE_THREADS: ${SNAKEMAKE_THREADS:-}
      OCDOCKER_TMP_DIR: ${OCDOCKER_TMP_DIR:-}
      PYTHONUNBUFFERED: "1"
    volumes:
      - ${OCDOCKER_WORKSPACE:-./workspace}:/workspace
      - ocdocker_cache:/root/.cache
    working_dir: /workspace
    stdin_open: true
    tty: true

volumes:
  mysql_data:
  ocdocker_cache:
