services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ocdocker
      POSTGRES_USER: ocdocker
      POSTGRES_PASSWORD: ${OCDOCKER_DB_PASS:-ocdocker_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgresql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  ocdocker:
    build:
      context: ../..
      dockerfile: containers/docker/ocdocker.dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      OCDOCKER_CONFIG: /data/hd4tb/OCDocker/OCDocker/containers/docker/OCDocker.cfg.docker
      OCDOCKER_DB_BACKEND: ${OCDOCKER_DB_BACKEND:-postgresql}
      PYTHONUNBUFFERED: "1"
    volumes:
      - ${HOST_OCDOCKER_ROOT:-/data/hd4tb/OCDocker}:/data/hd4tb/OCDocker
      - ocdocker_cache:/root/.cache
    working_dir: /data/hd4tb/OCDocker/OCDocker
    stdin_open: true
    tty: true
    user: root

volumes:
  postgres_data:
  ocdocker_cache:
