[build-system]
requires = ["setuptools>=80", "wheel>=0.47.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["OCDocker*", "oddt*"]

[project]
name = "OCDocker"
dynamic = ["version"]
description = "OCDocker is a Python package for molecular docking automation, virtual screening and AI consensus scoring."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE", "NOTICE"]
authors = [
  { name = "Artur Duque Rossi", email = "arturossi10@gmail.com" },
]
requires-python = ">=3.11"

# Minimal runtime: CLI bootstrap, config I/O, logging, and serialization helpers.
dependencies = [
  "configargparse>=1.7",
  "joblib>=1.4.2",
  "packaging>=25.0",
  "pydantic>=2.11.4",
  "pydantic-settings>=2.9.1",
  "pyyaml>=6.0.2",
  "requests>=2.32.3",
  "rich>=13.9.1",
  "tqdm>=4.66.5",
]

classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

keywords = ["docking", "virtual screening", "AI", "bioinformatics", "drug discovery"]

[tool.setuptools.dynamic]
version = { attr = "OCDocker._version.__version__" }

[tool.setuptools.package-data]
"OCDocker.OCScore" = ["Protocols/*.yml", "Protocols/Ablations/*.yml"]
"OCDocker.Workbench" = ["static/*", "Snakefiles/*.smk"]
# Vendored ODDT fork (scripts/vendor_oddt.sh) is built by OCDocker's own
# packaging config, not its own setup.py, so its data files (needed to train
# RFScore/NNScore/PLECscore scoring functions on first run) must be declared
# here too or they're silently dropped from the wheel.
"oddt.scoring.functions" = ["NNScore/*.csv", "RFScore/*.csv", "PLECscore/*.json", "PLECscore/*.csv.gz"]
"oddt.toolkits.extras" = ["pdb_residue_templates.smi"]
# oddt/filter/ has no __init__.py upstream, so it isn't its own discovered
# package; declare its data file under "oddt" (a real package) instead --
# virtualscreening.py's PAINS filter reads it via a package-relative path.
"oddt" = ["filter/pains.smarts"]

[project.urls]
Homepage = "https://github.com/Arturossi/OCDocker"
Repository = "https://github.com/Arturossi/OCDocker"
Issues = "https://github.com/Arturossi/OCDocker/issues"

[project.scripts]
ocdocker = "OCDocker.CLI:main"

