[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [
  "**/legacy/**",
  "**/future/**",
  "OCDocker/Docking/Future/**",
]

[tool.ruff.lint]
# NumPy docstring convention (ADR-0005): enforce module/class/public-function docs in scope.
# Not wired into pre-commit until legacy-excluded tree is clean — run manually via `ruff check OCDocker`.
select = ["D100", "D101", "D103"]
ignore = ["D104", "D105", "D106", "D107"]
