[build-system]
requires = ["flit_core>=3.2,<4"]
build-backend = "flit_core.buildapi"

[tool.setuptools]
packages = ["OCDocker"]

[project]
name = "OCDocker"
version = "0.9.0"
description = "OCDocker is a Python package for molecular docking automation, virtual screening and AI consensus scoring."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
  { name = "Artur Duque Rossi", email = "arturossi10@gmail.com" }
]
dependencies = [
  "rdkit",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "seaborn",
  "matplotlib",
  "scipy>=1.14",
  "openbabel",
  "numpy>=1.26",
  "optuna",
  "pingouin",
  "torch>=2.4",
  "torchaudio>=2.4",
  "torchvision>=0.19",
  "xgboost>=2.1",
  "lime",
  "pyyaml",
  "joblib",
  "biopython",
  "dcor",
  "fsspec",
  "numba>=0.60",
  "python-graphviz",
  "torchsummary",
  "torchviz",
]
requires-python = ">=3.9"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Bio-Informatics"
]
keywords = ["docking", "virtual screening", "AI", "bioinformatics", "drug discovery"]

[project.urls]
Homepage = "https://github.com/Arturossi/OCDocker"
Repository = "https://github.com/Arturossi/OCDocker"
Issues = "https://github.com/Arturossi/OCDocker/issues"

[tool.flit.module]
name = "OCDocker"
