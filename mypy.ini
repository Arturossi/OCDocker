[mypy]
# Mypy configuration for OCDocker
# See https://mypy.readthedocs.io/en/stable/config_file.html

# Python version
python_version = 3.11

# Platform
platform = linux

# Follow imports
follow_imports = normal

# Show error codes
show_error_codes = True

# Show column numbers
show_column_numbers = True

# Pretty output
pretty = True

# Color output
color_output = True

# Incremental mode (faster for large codebases)
incremental = True
cache_dir = .mypy_cache

# Warn about unused ignores
warn_unused_ignores = True

# Warn about unused configs
warn_unused_configs = True

# Warn about redundant casts
warn_redundant_casts = True


# Warn about no return
warn_no_return = True

# Warn about return any
warn_return_any = True

# Disallow untyped calls
disallow_untyped_calls = False

# Disallow untyped definitions
disallow_untyped_defs = False

# Disallow incomplete defs
disallow_incomplete_defs = False

# Check untyped defs
check_untyped_defs = True

# Disallow untyped decorators
disallow_untyped_decorators = False

# Ignore missing imports (for optional dependencies)
ignore_missing_imports = True

# Namespace packages
namespace_packages = True

# Explicit package bases
explicit_package_bases = True

# Strict optional
strict_optional = True


# Per-module options
[mypy-rdkit.*]
ignore_missing_imports = True

[mypy-openbabel.*]
ignore_missing_imports = True

[mypy-pandas.*]
ignore_missing_imports = True

[mypy-numpy.*]
ignore_missing_imports = True

[mypy-torch.*]
ignore_missing_imports = True

[mypy-optuna.*]
ignore_missing_imports = True

[mypy-xgboost.*]
ignore_missing_imports = True

[mypy-lime.*]
ignore_missing_imports = True

[mypy-biopython.*]
ignore_missing_imports = True

[mypy-pingouin.*]
ignore_missing_imports = True

[mypy-scipy.*]
ignore_missing_imports = True

[mypy-sklearn.*]
ignore_missing_imports = True

[mypy-matplotlib.*]
ignore_missing_imports = True

[mypy-seaborn.*]
ignore_missing_imports = True

# Test files - allow more flexibility
[mypy-tests.*]
disallow_untyped_defs = False
disallow_incomplete_defs = False
