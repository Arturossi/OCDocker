# pytest.ini
[pytest]
pythonpath = .
testpaths = tests
addopts = -ra
markers =
    archived: archived OCScore / analysis tests; excluded via pytest -m "not archived"
    order: explicit execution order within a test module (used by tests/conftest.py sorting)
    database: database tests, including local SQLite and optional server backends
    external: tests requiring external services, binaries, or networked databases
    slow: tests that are slower than the unit-test default
