# pytest.ini
[pytest]
pythonpath = .
testpaths = tests

# Coverage configuration
[coverage:run]
source = OCDocker
omit = 
    */tests/*
    */test_*.py
    */__pycache__/*
    */__init__.py
    */setup.py
    */conftest.py
    # Omit Future directory (reference implementations for future work)
    # Multiple patterns to catch all variations
    OCDocker/Docking/Future/*
    OCDocker/Docking/Future/**
    Docking/Future/*
    Docking/Future/**
    **/Docking/Future/*
    **/Docking/Future/**
    *Docking/Future*
    *Future*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
