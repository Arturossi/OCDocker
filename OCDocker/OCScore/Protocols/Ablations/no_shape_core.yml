name: no_shape_core
description: Remove core ligand 3D shape descriptors.
include_patterns:
  - "*"
exclude_features:
  - ligand_PMI1
  - ligand_PMI2
  - ligand_PMI3
  - ligand_NPR1
  - ligand_NPR2
  - ligand_Asphericity
  - ligand_Eccentricity
  - ligand_InertialShapeFactor
  - ligand_RadiusOfGyration
  - ligand_SpherocityIndex
